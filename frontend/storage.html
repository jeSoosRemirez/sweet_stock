<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">
    <!-- Storage Tab -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <a class="nav-link active" id="viewStorage-tab" data-bs-toggle="tab" href="#viewStorage" role="tab" aria-controls="viewStorage" aria-selected="true">View Storage</a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link" id="createStorage-tab" data-bs-toggle="tab" href="#createStorage" role="tab" aria-controls="createStorage" aria-selected="false">Create Storage</a>
        </li>
    </ul>

    <div class="tab-content" id="myTabContent">
        <!-- View Storage Tab -->
        <div class="tab-pane fade show active" id="viewStorage" role="tabpanel" aria-labelledby="viewStorage-tab">
            <h3 class="mt-3">Storage List</h3>
            <table class="table table-bordered mt-2" id="storageTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Max Weight</th>
                        <th>Max Quantity</th>
                        <th>Current Weight</th>
                        <th>Current Quantity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Storage Data will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Create Storage Tab -->
        <div class="tab-pane fade" id="createStorage" role="tabpanel" aria-labelledby="createStorage-tab">
            <h3 class="mt-3">Create New Storage</h3>
            <form id="createStorageForm">
                <div class="mb-3">
                    <label for="storageName" class="form-label">Storage Name</label>
                    <input type="text" class="form-control" id="storageName" required>
                </div>
                <div class="mb-3">
                    <label for="storageAddress" class="form-label">Storage Address</label>
                    <input type="text" class="form-control" id="storageAddress" required>
                </div>
                <div class="mb-3">
                    <label for="maxWeight" class="form-label">Max Weight</label>
                    <input type="number" class="form-control" id="maxWeight" required>
                </div>
                <div class="mb-3">
                    <label for="maxQuantity" class="form-label">Max Quantity</label>
                    <input type="number" class="form-control" id="maxQuantity" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Storage</button>
            </form>
        </div>
    </div>
</div>

<script>
    const storageApiUrl = 'http://127.0.0.1:8000/api/storage/';

    // Fetch and display all storages
    async function fetchStorages() {
        try {
            const response = await fetch(storageApiUrl);
            const storages = await response.json();
            const storageTableBody = document.querySelector("#storageTable tbody");
            storageTableBody.innerHTML = ''; // Clear existing rows

            storages.forEach(storage => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${storage.name}</td>
                    <td>${storage.address}</td>
                    <td>${storage.max_weight}</td>
                    <td>${storage.max_quantity}</td>
                    <td>${storage.storing_weight || 0}</td>
                    <td>${storage.storing_quantity || 0}</td>
                    <td>
                        <button class="btn btn-info btn-sm" onclick="updateStorage('${storage.id}')">Update</button>
                    </td>
                `;
                storageTableBody.appendChild(row);
            });
        } catch (error) {
            console.error("Error fetching storages:", error);
        }
    }

    // Create a new storage
    async function createStorage(event) {
        event.preventDefault();

        const storageData = {
            name: document.getElementById("storageName").value,
            address: document.getElementById("storageAddress").value,
            max_weight: parseFloat(document.getElementById("maxWeight").value),
            max_quantity: parseInt(document.getElementById("maxQuantity").value),
        };

        try {
            const response = await fetch(storageApiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(storageData),
            });

            if (response.ok) {
                alert("Storage created successfully!");
                fetchStorages();  // Reload storages list
                document.getElementById("createStorageForm").reset();  // Reset form
            } else {
                const result = await response.json();
                alert("Error creating storage: " + result.detail);
            }
        } catch (error) {
            console.error("Error creating storage:", error);
        }
    }

    // Update an existing storage
    function updateStorage(storageId) {
        // Fetch storage data for the specified ID
        const storage = storages.find(storage => storage.id === storageId);
        if (!storage) {
            alert("Storage not found!");
            return;
        }

        // Fill the form with storage data
        document.getElementById("storageName").value = storage.name;
        document.getElementById("storageAddress").value = storage.address;
        document.getElementById("maxWeight").value = storage.max_weight;
        document.getElementById("maxQuantity").value = storage.max_quantity;

        // Change form to submit as update
        const updateBtn = document.createElement("button");
        updateBtn.type = "submit";
        updateBtn.classList.add("btn", "btn-primary");
        updateBtn.textContent = "Update Storage";
        document.getElementById("createStorageForm").appendChild(updateBtn);

        // Submit update form logic (for future use)
        updateBtn.addEventListener("click", async function (event) {
            event.preventDefault();
            const updatedData = {
                name: document.getElementById("storageName").value,
                address: document.getElementById("storageAddress").value,
                max_weight: parseFloat(document.getElementById("maxWeight").value),
                max_quantity: parseInt(document.getElementById("maxQuantity").value),
            };

            const updateResponse = await fetch(`${storageApiUrl}${storageId}/`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(updatedData),
            });

            if (updateResponse.ok) {
                alert("Storage updated successfully!");
                fetchStorages();
                document.getElementById("createStorageForm").reset();
            } else {
                alert("Error updating storage.");
            }
        });
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', () => {
        fetchStorages();  // Fetch and display storages on page load

        const createStorageForm = document.getElementById("createStorageForm");
        createStorageForm.addEventListener("submit", createStorage);  // Attach form submit handler
    });
</script>

</body>
</html>
