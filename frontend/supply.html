<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">
    <!-- Supply Tab -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <a class="nav-link active" id="viewSupply-tab" data-bs-toggle="tab" href="#viewSupply" role="tab" aria-controls="viewSupply" aria-selected="true">View Supply</a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link" id="createSupply-tab" data-bs-toggle="tab" href="#createSupply" role="tab" aria-controls="createSupply" aria-selected="false">Create Supply</a>
        </li>
    </ul>

    <div class="tab-content" id="myTabContent">
        <!-- View Supply Tab -->
        <div class="tab-pane fade show active" id="viewSupply" role="tabpanel" aria-labelledby="viewSupply-tab">
            <h3 class="mt-3">Supply List</h3>
            <table class="table table-bordered mt-2" id="supplyTable">
                <thead>
                    <tr>
                        <th>Supply Type</th>
                        <th>Weight</th>
                        <th>Quantity</th>
                        <th>From Storage</th>
                        <th>To Storage</th>
                        <th>Product ID</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Supply Data will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Create Supply Tab -->
        <div class="tab-pane fade" id="createSupply" role="tabpanel" aria-labelledby="createSupply-tab">
            <h3 class="mt-3">Create New Supply</h3>
            <form id="createSupplyForm">
                <div class="mb-3">
                    <label for="supplyType" class="form-label">Supply Type</label>
                    <select class="form-control" id="supplyType" required>
                        <option value="SUPPLY">SUPPLY</option>
                        <option value="REDIRECTION">REDIRECTION</option>
                    </select>
                </div>

                <!-- From Storage Dropdown -->
                <div class="mb-3">
                    <label for="fromStorageId" class="form-label">From Storage</label>
                    <select class="form-control" id="fromStorageId" required>
                        <option value="">Select Storage</option>
                    </select>
                </div>

                <!-- To Storage Dropdown -->
                <div class="mb-3">
                    <label for="toStorageId" class="form-label">To Storage</label>
                    <select class="form-control" id="toStorageId" required>
                        <option value="">Select Storage</option>
                    </select>
                </div>

                <!-- Product Dropdown -->
                <div class="mb-3">
                    <label for="productId" class="form-label">Product</label>
                    <select class="form-control" id="productId" required>
                        <option value="">Select Product</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="weight" class="form-label">Weight</label>
                    <input type="number" class="form-control" id="weight" min="0" step="any">
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="quantity" min="0">
                </div>

                <button type="submit" class="btn btn-primary">Create Supply</button>
            </form>
        </div>
    </div>
</div>

<script>
    const supplyApiUrl = 'http://127.0.0.1:8000/api/supply/';
    const storageApiUrl = 'http://127.0.0.1:8000/api/storage/';
    const productApiUrl = 'http://127.0.0.1:8000/api/product/';
    
    // Fetch available storages, products, and users to populate the dropdowns
    async function fetchOptions() {
        try {
            // Fetch storage, product, and user data
            const [storagesRes, productsRes] = await Promise.all([
                fetch(storageApiUrl),
                fetch(productApiUrl),
            ]);
    
            const storages = await storagesRes.json();
            const products = await productsRes.json();
    
            populateSelectDropdown("fromStorageId", storages);
            populateSelectDropdown("toStorageId", storages);
            populateSelectDropdown("productId", products);
    
        } catch (error) {
            console.error("Error fetching options:", error);
        }
    }
    
    // Helper function to populate a dropdown
    function populateSelectDropdown(selectId, data) {
        const selectElement = document.getElementById(selectId);
        selectElement.innerHTML = ''; // Clear previous options
    
        // Create a "None" option at the beginning
        const noneOption = document.createElement("option");
        noneOption.value = "";  // Value should be empty string, which corresponds to null in JavaScript
        noneOption.textContent = "None";  // Label as 'None'
        selectElement.appendChild(noneOption);
    
        // Populate the rest of the options
        data.forEach(item => {
            const option = document.createElement("option");
            option.value = item.id;  // Assuming 'id' is the key for these objects
            option.textContent = item.name;  // Assuming 'name' is the display field
            selectElement.appendChild(option);
        });
    }
    
    // Fetch and display all supplies
    async function fetchSupplies() {
        try {
            const response = await fetch(supplyApiUrl);
            const supplies = await response.json();
            const supplyTableBody = document.querySelector("#supplyTable tbody");
            supplyTableBody.innerHTML = ''; // Clear existing rows
    
            supplies.forEach(supply => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${supply.supply_type}</td>
                    <td>${supply.weight || 'N/A'}</td>
                    <td>${supply.quantity || 'N/A'}</td>
                    <td>${supply.from_storage_id || 'N/A'}</td>
                    <td>${supply.to_storage_id}</td>
                    <td>${supply.product_id}</td>
                    <td>
                        <button class="btn btn-info btn-sm" onclick="updateSupply('${supply.id}')">Update</button>
                    </td>
                `;
                supplyTableBody.appendChild(row);
            });
        } catch (error) {
            console.error("Error fetching supplies:", error);
        }
    }
    
    // Create a new supply
    // Create a new supply
// Create a new supply
// Create a new supply
async function createSupply(event) {
    event.preventDefault();

    const supplyData = {
        supply_type: document.getElementById("supplyType").value,
        weight: parseFloat(document.getElementById("weight").value) || undefined,
        quantity: parseInt(document.getElementById("quantity").value) || undefined,
        
        // Check if 'None' was selected, set to null
        from_storage_id: document.getElementById("fromStorageId").value === "" ? null : document.getElementById("fromStorageId").value,
        to_storage_id: document.getElementById("toStorageId").value === "" ? null : document.getElementById("toStorageId").value,
        
        product_id: document.getElementById("productId").value,
    };

    // Manual validation: Check if required fields are filled
    if (!supplyData.supply_type || !supplyData.product_id || !supplyData.to_storage_id) {
        alert("Please fill in all required fields.");
        return; // Exit if validation fails
    }

    try {
        const response = await fetch(supplyApiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(supplyData),
        });

        if (response.ok) {
            alert("Supply created successfully!");
            fetchSupplies();  // Reload supplies list
            document.getElementById("createSupplyForm").reset();  // Reset form
        } else {
            const result = await response.json();
            alert("Error creating supply: " + result.detail);
        }
    } catch (error) {
        console.error("Error creating supply:", error);
    }
}

    
    // Call the fetchSupplies function on page load to get supply data
    window.onload = function() {
        fetchSupplies();
        fetchOptions();  // Fetch storages, products, and
    };
    
    document.getElementById("createSupplyForm").addEventListener("submit", createSupply);
    
</script>

</body>
</html>
